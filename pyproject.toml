[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "debtscope"
version = "0.1.0"
description = "Corporate debt structure and maturity-wall extraction from SEC EDGAR filings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "openpyxl>=3.1"]
optional-dependencies = {fast = ["lxml>=4.9"]}

[project.scripts]
debtscope = "debtscope.cli:main"

[tool.setuptools]
packages = ["debtscope"]

[tool.setuptools.package-data]
debtscope = ["web/*"]
